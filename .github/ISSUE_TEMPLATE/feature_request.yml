name: Feature Request
description: Suggest an idea or improvement for Tech-Me
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement!
        Tech-Me prioritizes portable, cross-agent guidance without unnecessary dependencies or vendor lock-in.
  - type: textarea
    id: problem-to-solve
    attributes:
      label: Problem to Solve
      description: What problem or architectural decision gap does this feature address?
      placeholder: Describe the pain point or missed scenario...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the proposed enhancement or behavior...
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
      placeholder: Describe alternative solutions or why this approach is preferred...
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, relevant scenarios, or references.
    validations:
      required: false
